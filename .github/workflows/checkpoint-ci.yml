name: Checkpoint verification
run-name: Checkpoint verification - ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'run-checkpoint-ci' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/safety-ci.yml
    with:
      checkpoint_sha: ${{ github.event.pull_request.head.sha || github.sha }}
  prepared_go:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'run-checkpoint-ci' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/prepared-export-go.yml
    with:
      checkpoint_sha: ${{ github.event.pull_request.head.sha || github.sha }}
  prepared_browser:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'run-checkpoint-ci' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/prepared-export-browser.yml
    with:
      checkpoint_sha: ${{ github.event.pull_request.head.sha || github.sha }}
