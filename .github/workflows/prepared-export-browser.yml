name: Prepared export browser verification

on:
  push:
    branches: [fix/large-media-exports]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Prepared jobs and native playback — attempt ${{ matrix.attempt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/ci-media-apt.sh update
      - run: bash .github/scripts/ci-media-apt.sh install ffmpeg python3-venv openssl
      - name: Build the exact checkout runtime image
        run: docker build -t simplenvr-export-test .
      - name: Install pinned Chrome tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/export-browser-venv"
          . "$RUNNER_TEMP/export-browser-venv/bin/activate"
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chrome
      - name: Protocol regressions and real HTTPS/browser acceptance
        run: |
          . "$RUNNER_TEMP/export-browser-venv/bin/activate"
          python -m unittest discover -s tests -p 'test_prepared_export_protocol.py' -v
          bash tests/runtime-browser-acceptance.sh simplenvr-export-test "$RUNNER_TEMP/prepared-export-browser"
      - name: Retain media, network, browser and container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepared-export-browser-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.attempt }}
          path: ${{ runner.temp }}/prepared-export-browser
          if-no-files-found: warn
          retention-days: 14
