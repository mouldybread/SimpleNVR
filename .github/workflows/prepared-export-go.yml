name: Prepared export Go verification

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkpoint_sha:
        description: Immutable commit selected by the checkpoint caller
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  CHECKPOINT_SHA: ${{ inputs.checkpoint_sha || github.sha }}

jobs:
  go:
    name: Full Go build, race suite and vet
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOFLAGS: -mod=readonly
      SIMPLENVR_REQUIRE_FFMPEG: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKPOINT_SHA }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash .github/scripts/ci-media-apt.sh update
      - run: bash .github/scripts/ci-media-apt.sh install ffmpeg
      - name: Prepared protocol regression tests
        run: python3 -m unittest discover -s tests -p 'test_prepared_export_protocol.py' -v
      - name: Verify dependencies and build the exact checkout
        run: |
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
          go build ./...
      - name: Full race-enabled Go suite including Node and native media tests
        run: GITHUB_SHA="$CHECKPOINT_SHA" bash tests/core-ci-evidence.sh "$RUNNER_TEMP/prepared-export-go"
      - name: Static analysis
        if: always()
        run: go vet ./...
      - name: Retain Go execution evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepared-export-go-${{ env.CHECKPOINT_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prepared-export-go
          if-no-files-found: warn
          retention-days: 14
