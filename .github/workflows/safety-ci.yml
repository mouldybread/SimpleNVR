name: Safety verification

on:
  push:
    branches: [main, fix/recording-safety-audit]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Download and verify pinned dependencies
        run: |
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Build
        run: go build ./...
      - name: Race-enabled tests
        run: go test -race -count=1 -timeout=120s ./...
      - name: Static analysis
        if: always()
        run: go vet ./...
      - name: Assert dependency files remain unchanged
        if: always()
        run: git diff --exit-code -- go.mod go.sum
      - name: Verify runtime image builds
        run: docker build -t simplenvr-safety-test .
