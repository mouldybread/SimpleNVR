name: Safety verification

on:
  push:
    branches: [main, fix/recording-safety-audit]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Resolve and verify pinned dependencies
        run: go mod tidy && go mod verify
      - name: Build
        run: go build ./...
      - name: Race-enabled tests
        run: go test -race -count=1 -timeout=120s ./...
      - name: Static analysis
        if: always()
        run: go vet ./...
      - name: Show generated dependency lockfile for review
        if: always()
        run: cat go.sum
      - name: Verify runtime image builds
        run: docker build -t simplenvr-safety-test .
