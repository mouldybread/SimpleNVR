name: Safety verification

on:
  push:
    branches: [main, fix/recording-safety-audit]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build
        run: go build ./...
      - name: Race-enabled tests
        run: go test -race -count=1 -timeout=120s ./...
      - name: Static analysis
        if: always()
        run: go vet ./...
