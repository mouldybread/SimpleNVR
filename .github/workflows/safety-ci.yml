name: Safety verification

on:
  push:
    branches: [main, fix/recording-safety-audit]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=readonly
      SIMPLENVR_REQUIRE_FFMPEG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install synthetic media test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Download and verify pinned dependencies
        run: |
          go mod download
          go mod verify
          git diff --exit-code -- go.mod go.sum
      - name: Build
        run: go build ./...
      - name: Race-enabled tests including media and shutdown lifecycle
        run: go test -race -count=1 -timeout=120s ./...
      - name: Static analysis
        if: always()
        run: go vet ./...
      - name: Assert dependency files remain unchanged
        if: always()
        run: git diff --exit-code -- go.mod go.sum
      - name: Isolated real storage failures (private tmpfs namespace)
        shell: bash
        run: |
          set -euo pipefail
          go_bin=$(command -v go)
          unshare_bin=$(command -v unshare)
          host_mnt_ns=$(readlink /proc/self/ns/mnt)
          module_cache=$(go env GOMODCACHE)
          cache_dir=$(mktemp -d "${RUNNER_TEMP:?}/simplenvr-storage-go-cache.XXXXXX")
          trap 'sudo rm -rf -- "$cache_dir"' EXIT
          sudo env \
            SIMPLENVR_STORAGE_FAILURE_TESTS=1 \
            SIMPLENVR_STORAGE_HOST_MNT_NS="$host_mnt_ns" \
            SIMPLENVR_REQUIRE_FFMPEG=1 \
            GOFLAGS=-mod=readonly \
            GOMODCACHE="$module_cache" \
            GOCACHE="$cache_dir" \
            "$unshare_bin" --mount --propagation private --fork \
            "$go_bin" test -race -count=1 -timeout=120s -v \
            -run '^TestStorageFailureMountNamespace' ./...
          git diff --exit-code -- go.mod go.sum
      - name: Verify runtime image builds
        run: docker build -t simplenvr-safety-test .
      - name: Runtime container SIGTERM smoke test
        shell: bash
        run: |
          set -euo pipefail
          state=$(mktemp -d)
          name=simplenvr-shutdown-ci
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true; rm -rf "$state"' EXIT
          printf '{"cameras":{},"camera_order":[],"events":[]}\n' > "$state/cameras.json"
          python3 -c 'import secrets; print(secrets.token_urlsafe(32))' | docker run --rm -i --user "$(id -u):$(id -g)" -v "$state:/recordings" simplenvr-safety-test auth set-password ci-admin
          docker run -d --name "$name" -v "$state:/recordings" --tmpfs /certs simplenvr-safety-test
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec "$name" wget --no-check-certificate -q -O /dev/null https://127.0.0.1/auth/login; then ready=1; break; fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then docker logs "$name"; exit 1; fi
          docker stop --timeout 75 "$name"
          docker logs "$name"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$name")" -eq 0
          docker logs "$name" 2>&1 | grep -F 'Shutdown complete; recording intent persisted'
          sudo python3 -c 'import json,os,stat,sys; p=sys.argv[1]; s=os.stat(p); assert stat.S_ISREG(s.st_mode); assert stat.S_IMODE(s.st_mode) == 0o600, oct(stat.S_IMODE(s.st_mode)); d=json.load(open(p)); assert d["cameras"] == {}' "$state/cameras.json"
