services:
  simplenvr:
    image: ghcr.io/mouldybread/simplenvr:${SIMPLENVR_VERSION:-v0.2.2}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:443"
    environment:
      NVR_EXPORT_SCRATCH_DIR: /exports
    volumes:
      - type: bind
        source: ./recordings
        target: /recordings
        bind:
          create_host_path: false
      - type: bind
        source: ./exports
        target: /exports
        bind:
          create_host_path: false
      - ./certs:/certs
